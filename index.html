<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI HL T4 Assessment Prep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b1a2e;--bg2:#10243d;--card:#142c4a;--line:#1f3d61;--teal:#2dd4bf;--teal2:#14b8a6;--text:#e6edf5;--muted:#9fb3c8;--amber:#fbbf24;--red:#f87171;--green:#4ade80;--mono:'JetBrains Mono',monospace;--sans:'Inter',system-ui,sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);line-height:1.5}
header{background:var(--bg2);border-bottom:1px solid var(--line);padding:14px 20px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
header h1{font-size:17px;margin:0;font-weight:600}header h1 span{color:var(--teal);font-family:var(--mono);font-size:13px;margin-left:8px}
nav{display:flex;flex-wrap:wrap;gap:6px}nav button{background:transparent;border:1px solid var(--line);color:var(--muted);padding:7px 12px;border-radius:8px;cursor:pointer;font-family:var(--sans);font-size:13px}
nav button.on{background:var(--teal);color:#06202a;border-color:var(--teal);font-weight:600}
main{max-width:1000px;margin:0 auto;padding:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px}
h2{font-size:18px;margin:0 0 8px}h3{font-size:15px;margin:14px 0 6px;color:var(--teal)}
.muted{color:var(--muted);font-size:13px}
.tag{display:inline-block;font-family:var(--mono);font-size:11px;padding:2px 7px;border-radius:6px;border:1px solid var(--line);color:var(--muted);margin-right:4px}
.tag.ahl{border-color:#b45309;color:var(--amber)}.tag.sl{border-color:var(--teal2);color:var(--teal)}
.q{font-size:15px;margin:8px 0}table.mini{border-collapse:collapse;margin:6px 0;font-size:13px}table.mini td,table.mini th{border:1px solid var(--line);padding:3px 9px;text-align:center}
input[type=text]{background:var(--bg);border:1px solid var(--line);color:var(--text);padding:8px 10px;border-radius:8px;font-family:var(--mono);font-size:14px;width:180px}
button.btn{background:var(--teal);color:#06202a;border:0;padding:8px 14px;border-radius:8px;font-weight:600;cursor:pointer;font-family:var(--sans);font-size:13px;margin:4px 4px 4px 0}
button.ghost{background:transparent;color:var(--teal);border:1px solid var(--teal)}button.ghost2{background:transparent;color:var(--muted);border:1px solid var(--line)}
.fb{margin-top:8px;padding:10px;border-radius:8px;font-size:14px}.ok{background:#0f3d2e;border:1px solid var(--green)}.bad{background:#3d1515;border:1px solid var(--red)}.info{background:#12304a;border:1px solid var(--line)}
.scheme{font-family:var(--mono);font-size:12.5px;white-space:normal;background:var(--bg);padding:10px;border-radius:8px;margin-top:6px;border-left:3px solid var(--teal)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.bar{height:8px;background:var(--bg);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--teal)}
.pill{font-family:var(--mono);font-size:12px;padding:2px 8px;border-radius:10px}.m{background:#0f3d2e;color:var(--green)}.d{background:#3d2f0f;color:var(--amber)}.s{background:#3d1515;color:var(--red)}.n{background:var(--bg);color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
ul{margin:4px 0 8px 18px;padding:0}li{margin:3px 0;font-size:14px}
.box{border:1px solid var(--line);border-radius:8px;padding:10px;margin:6px 0;background:var(--bg2)}
.fbox{font-family:var(--mono);font-size:13px;background:var(--bg);border-left:3px solid var(--teal);padding:8px 10px;border-radius:6px;margin:4px 0}
.timer{font-family:var(--mono);font-size:22px;color:var(--teal)}.timer.low{color:var(--red)}
textarea{width:100%;min-height:70px;background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:8px;font-family:var(--sans);font-size:14px}
details summary{cursor:pointer;color:var(--teal);font-size:13px}
.stem{background:var(--bg2);border-left:3px solid var(--amber);padding:8px 12px;border-radius:6px;margin:8px 0;font-size:14px}
@media(max-width:600px){header{padding:12px}main{padding:12px}}
</style>
</head>
<body>
<header><h1>AI HL T4 Assessment Prep <span>Discrete, Binomial, Normal, Hypothesis tests, Poisson, Linear combinations, CLT, Estimators, CI</span></h1>
<nav id="nav"></nav></header>
<main id="main"></main>
<script>
const SKILLS=[{"id": "T4.7-SL", "name": "Discrete random variables", "level": "SL", "short": "DRV"}, {"id": "T4.8-SL", "name": "Binomial distribution", "level": "SL", "short": "Binomial"}, {"id": "T4.9-SL", "name": "Normal distribution", "level": "SL", "short": "Normal"}, {"id": "T4.11-SL", "name": "Hypothesis tests: two-sample t-test and chi-squared", "level": "SL", "short": "t and chi-sq"}, {"id": "T4.17-AHL", "name": "Poisson distribution", "level": "AHL", "short": "Poisson"}, {"id": "T4.14-AHL", "name": "Linear combinations and unbiased estimators", "level": "AHL", "short": "Lin comb"}, {"id": "T4.15-AHL", "name": "Central limit theorem and sums of normals", "level": "AHL", "short": "CLT"}, {"id": "T4.16-AHL", "name": "Confidence intervals for a mean", "level": "AHL", "short": "CI"}, {"id": "T4.18-AHL", "name": "Tests for a mean, proportion, Poisson mean; Type I and II errors", "level": "AHL", "short": "z-tests, errors"}];const LEARN={"T4.7-SL": {"must": [["Booklet", "E(X) = &Sigma; x P(X = x)"], ["Memorise", "&Sigma; P(X = x) = 1 (use it to find an unknown probability k)"], ["Memorise", "A game is fair when E(gain) = 0; gain = winnings minus the cost to play"], ["Optional", "Var(X) = E(X<sup>2</sup>) minus [E(X)]<sup>2</sup>: not required in SL 4.7 exams; used in AHL 4.14"]], "method": ["Write the distribution as a table: x in one row, P(X = x) in the next.", "If a probability is unknown, set the probabilities to sum to 1 and solve.", "E(X): multiply each x by its probability and add. Show the sum written out.", "For a game, define the random variable as the gain (winnings minus stake), not the winnings.", "Answer in context with units where there are any."], "gdc": ["MENU 2 Statistics: List 1 = values of x, List 2 = probabilities.", "F2 CALC, F6 SET: 1Var XList = List1, 1Var Freq = List2. EXIT.", "F1 1VAR. The x-bar shown is E(X); &sigma;x<sup>2</sup> is Var(X).", "Still write the sum &Sigma; x P(X = x) on paper: the M1 is for the method, not the screen."], "watch": ["Forgetting that probabilities must sum to 1 (M1 lost).", "Computing E(winnings) instead of E(gain) in a game question.", "Rounding E(X) when it is exact (give 2.7, not 2.70; give 11/3 or 3.67, not 3.6)."]}, "T4.8-SL": {"must": [["Booklet", "X ~ B(n, p): E(X) = np, Var(X) = np(1 minus p)"], ["Memorise", "Conditions: fixed n, two outcomes, constant p, independent trials"], ["Memorise", "P(X &ge; k) = 1 minus P(X &le; k minus 1)"]], "method": ["State the distribution: X ~ B(n, p), with X defined in words.", "Rewrite the probability wanted as an inequality in the form the GDC uses (Bpd for exactly, Bcd for a range).", "Write the inequality you entered, then the GDC value to 3 s.f.", "For 'at least one', use 1 minus P(X = 0).", "For 'find n', set up 1 minus (1 minus p)<sup>n</sup> &ge; target and solve by log or by table; state n as an integer."], "gdc": ["MENU 2 Statistics, F5 DIST, F5 BINOMIAL.", "F1 Bpd: exactly x. Data: Variable; x, Numtrial n, p. EXE.", "F2 Bcd: cumulative. Enter Lower and Upper (use 0 as Lower for P(X &le; k), n as Upper for P(X &ge; k)).", "Write on paper: X ~ B(n, p), P(X &le; 3) = 0.493 (from GDC)."], "watch": ["P(X &ge; 5) entered as P(X &le; 5).", "Using Bpd (single value) when a range is asked.", "Not stating the distribution: 'X ~ B(12, 0.3)' is usually the first A1 or M1.", "Giving n as a decimal in 'smallest n' questions."]}, "T4.9-SL": {"must": [["Memorise", "Notation X ~ N(&mu;, &sigma;<sup>2</sup>): the second parameter is the variance, so write N(50, 8<sup>2</sup>)"], ["Memorise", "Symmetry: P(X < &mu; minus a) = P(X > &mu; + a)"], ["Memorise", "Standardise z = (x minus &mu;) / &sigma; when &mu; or &sigma; is unknown (use the inverse normal on N(0, 1))"]], "method": ["State X ~ N(&mu;, &sigma;<sup>2</sup>) and define X.", "Sketch the curve, shade the region, mark &mu; and the boundary.", "Probability: Ncd with lower and upper; use 1E99 or minus 1E99 for infinity.", "Inverse: InvN with the tail and area. Check the answer sits on the correct side of &mu;.", "Unknown &mu; or &sigma;: find the z-value with InvN on N(0, 1), then solve x = &mu; + z&sigma;. Two unknowns need two equations."], "gdc": ["MENU 2 Statistics, F5 DIST, F1 NORM.", "F2 Ncd: Lower, Upper, &sigma;, &mu;. Note the order: sigma before mu.", "F3 InvN: Tail (Left, Right or Central), Area, &sigma;, &mu;.", "For z-values: InvN with &sigma; = 1, &mu; = 0."], "watch": ["Entering the variance where the GDC wants &sigma;.", "Right tail entered as Left (answer on the wrong side of the mean).", "No sketch: the sketch is often the M1 when the probability is wrong.", "Rounding z to 2 d.p. before solving for &mu; and &sigma; (lose the A1)."]}, "T4.11-SL": {"must": [["Memorise", "H<sub>0</sub> is always 'no difference / no association / equal to'; H<sub>1</sub> is what you are testing for"], ["Memorise", "Reject H<sub>0</sub> when p-value < significance level"], ["Memorise", "Chi-squared independence: df = (rows minus 1)(columns minus 1); expected = row total &times; column total / grand total"], ["Memorise", "Goodness of fit: df = categories minus 1 (minus one more for each parameter estimated from the data)"], ["Memorise", "SL 4.11 t-test: the two-sample, unpaired, pooled t-test comparing two means, one- or two-tailed. The one-sample test for a mean is AHL 4.18"]], "method": ["Write H<sub>0</sub> and H<sub>1</sub> in context, with symbols.", "Name the test and the significance level.", "Enter the data; read the p-value (and the statistic if asked).", "Compare: p < &alpha; so reject H<sub>0</sub>, or p > &alpha; so insufficient evidence to reject H<sub>0</sub>.", "Conclude in the words of the question. Never say 'accept H<sub>0</sub>'."], "gdc": ["Chi-squared independence: MENU 2, F3 TEST, F3 CHI, F2 2WAY. Observed into Mat A (set rows and columns), Expected to Mat B. Read p, &chi;<sup>2</sup>, df. Mat B holds the expected values if asked.", "Goodness of fit: F3 TEST, F3 CHI, F1 GOF. Observed in List 1, Expected in List 2, df. Read p.", "Two-sample t: F3 TEST, F2 t, F2 2-SAMPLE. Data in List 1 and List 2, Pooled: On."], "watch": ["Hypotheses without context, or H<sub>1</sub> written as an inequality for a chi-squared test (it should be 'not independent').", "Comparing the statistic to the critical value when the question gives a p-value, or vice versa.", "Forgetting Pooled: On for the two-sample t-test.", "Concluding 'the data are independent' (you can only fail to reject)."]}, "T4.17-AHL": {"must": [["Booklet", "X ~ Po(m): E(X) = Var(X) = m"], ["Memorise", "P(X = x) = e<sup>minus m</sup> m<sup>x</sup> / x! (not needed with the GDC but recognise it)"], ["Memorise", "Scale the mean to the interval: 4 per hour means Po(6) for 90 minutes"], ["Memorise", "If X ~ Po(a) and Y ~ Po(b) are independent, X + Y ~ Po(a + b)"]], "method": ["Check the Poisson conditions: events occur randomly, independently, singly, at a constant mean rate.", "Scale the mean to the time or length in the question and state X ~ Po(m).", "Write the inequality, then Ppd (exactly) or Pcd (cumulative).", "For 'at least', use 1 minus Pcd(0 to k minus 1).", "For a combined count, add the means first, then compute."], "gdc": ["MENU 2 Statistics, F5 DIST, F6 (next page), F1 POISSON.", "F1 Ppd: x and &mu; (the GDC calls the mean &mu;).", "F2 Pcd: Lower, Upper, &mu;. For 'at least k' use the exact complement 1 minus Pcd(0, k minus 1); a large Upper is only an approximation.", "Write: X ~ Po(3.2), P(X &ge; 3) = 1 minus P(X &le; 2) = 0.620."], "watch": ["Not rescaling the mean (using 4 for 90 minutes).", "Adding probabilities instead of adding means for a combined count.", "Using Poisson when there is a fixed number of trials (that is binomial).", "P(X &ge; 3) entered as Pcd(3 to upper) is fine, but 1 minus Pcd(0, 3) is wrong by one term."]}, "T4.14-AHL": {"must": [["Booklet", "E(aX + b) = aE(X) + b; Var(aX + b) = a<sup>2</sup>Var(X)"], ["Booklet", "E(a<sub>1</sub>X<sub>1</sub> + ... + a<sub>n</sub>X<sub>n</sub>) = a<sub>1</sub>E(X<sub>1</sub>) + ... ; Var(...) = a<sub>1</sub><sup>2</sup>Var(X<sub>1</sub>) + ... for independent X<sub>i</sub>"], ["Booklet", "Unbiased estimate of &sigma;<sup>2</sup>: s<sub>n minus 1</sub><sup>2</sup> = n/(n minus 1) &times; s<sub>n</sub><sup>2</sup>; x-bar is an unbiased estimate of &mu;"], ["Memorise", "Var(X minus Y) = Var(X) + Var(Y) for independent X and Y: variances add even when you subtract"], ["Memorise", "3X (one value tripled) is not X<sub>1</sub> + X<sub>2</sub> + X<sub>3</sub> (three independent values): Var 9&sigma;<sup>2</sup> versus 3&sigma;<sup>2</sup>"]], "method": ["Identify whether the quantity is a multiple of one variable or a sum of independent copies.", "Apply E() first (linear, always), then Var() (square the constants, drop the + b, add variances).", "For a sample mean of n values: E(X-bar) = &mu;, Var(X-bar) = &sigma;<sup>2</sup>/n.", "For unbiased estimates from data: read s<sub>x</sub> (the n minus 1 version) from 1VAR and square it; or convert from &sigma;<sub>x</sub> with n/(n minus 1)."], "gdc": ["MENU 2 Statistics, data in List 1, F2 CALC, F1 1VAR.", "&sigma;x is the population SD (s<sub>n</sub>); sx is the unbiased SD (s<sub>n minus 1</sub>).", "Square sx for the unbiased variance estimate. State which one you used."], "watch": ["Subtracting variances for X minus Y.", "Forgetting to square the multiplier in Var(3X) = 9Var(X).", "Reporting &sigma;x<sup>2</sup> when the question asks for an unbiased estimate of the population variance.", "Writing 'Var(X + Y) = Var(X) + Var(Y)' without stating independence."]}, "T4.15-AHL": {"must": [["Memorise", "X-bar ~ N(&mu;, &sigma;<sup>2</sup>/n) for a sample of size n from N(&mu;, &sigma;<sup>2</sup>). Not printed in the formula booklet"], ["Memorise", "Central limit theorem: for any population with mean &mu; and variance &sigma;<sup>2</sup>, X-bar is approximately N(&mu;, &sigma;<sup>2</sup>/n) for large n. IB convention: n > 30 is sufficient; in general it depends on the population shape"], ["Memorise", "A linear combination of independent normal variables is normal; a sum of n independent N(&mu;, &sigma;<sup>2</sup>) is N(n&mu;, n&sigma;<sup>2</sup>)"]], "method": ["Decide: sum of n values (mean n&mu;, variance n&sigma;<sup>2</sup>) or mean of n values (mean &mu;, variance &sigma;<sup>2</sup>/n).", "If the population is not normal, say 'by the CLT, since n is large' (the R1).", "State the distribution of X-bar or S with its variance, then its SD for the GDC.", "Compute with Ncd or InvN as for any normal."], "gdc": ["NORM Ncd / InvN as usual, with &sigma; = &sigma;/&radic;n for a mean, or &sigma;&radic;n for a sum.", "Write the standard deviation you entered, e.g. &sigma;/&radic;36 = 2."], "watch": ["Entering &sigma;<sup>2</sup>/n as the SD.", "Dividing by n instead of &radic;n.", "Omitting the CLT statement when the population is not stated to be normal.", "Using the sum distribution for a question about the mean."]}, "T4.16-AHL": {"must": [["Memorise", "CI for &mu;, &sigma; known: x-bar &plusmn; z &times; &sigma;/&radic;n (z = 1.960 for 95%, 1.645 for 90%, 2.576 for 99%)"], ["Memorise", "CI for &mu;, &sigma; unknown: x-bar &plusmn; t<sub>n minus 1</sub> &times; s<sub>n minus 1</sub>/&radic;n, using the GDC"], ["Memorise", "Interpretation: if the method were repeated many times, 95% of the intervals would contain the true population mean. The interval either contains &mu; or it does not; there is no probability about &mu; itself."], ["Memorise", "Width = 2 &times; margin; a larger n or a lower confidence level gives a narrower interval"]], "method": ["Decide z or t: population &sigma; known means z; &sigma; estimated from the sample means t, whatever the sample size.", "Enter the data or the summary statistics with the confidence level.", "Write the interval to 3 s.f. as [lower, upper] with units.", "For a 'find n' question, set the margin z&sigma;/&radic;n equal to the target and solve, then round n up."], "gdc": ["MENU 2 Statistics, F4 INTR.", "F1 Z, F1 1-SAMPLE: C-Level, &sigma;, x-bar, n (Variable) or List (Data).", "F2 t, F1 1-SAMPLE: C-Level, x-bar, sx, n or List. sx must be the n minus 1 SD.", "Read Lower and Upper."], "watch": ["Using z when &sigma; is unknown; t is required at any n.", "Interpreting as 'there is a 95% probability that &mu; lies in the interval' (R mark lost).", "Entering s<sub>n</sub> instead of s<sub>n minus 1</sub> in the t interval.", "Rounding n down in 'find n' questions."]}, "T4.18-AHL": {"must": [["Memorise", "Mean of a normal population: z-test when &sigma; known, z = (x-bar minus &mu;<sub>0</sub>) / (&sigma;/&radic;n); one-sample t-test when &sigma; unknown, for any n. Matched pairs: one-sample test on the differences"], ["Memorise", "Critical region: the set of values of the statistic for which H<sub>0</sub> is rejected; critical value is its boundary"], ["Memorise", "Type I error: reject a true H<sub>0</sub>. P(Type I) = P(rejection region | H<sub>0</sub>): &alpha; for a continuous test at level &alpha;; for discrete binomial or Poisson tests the actual tail probability, normally below &alpha;"], ["Memorise", "Correlation test: bivariate normal data, H<sub>0</sub>: &rho; = 0, t-test on the regression (GDC TEST t REG); report p and conclude"], ["Memorise", "Type II error: fail to reject H<sub>0</sub> when it is false. P(Type II) = P(not in rejection region | H<sub>1</sub> value of the parameter)"], ["Memorise", "Binomial test for a proportion and Poisson test for a mean: p-value is the tail probability of the observed value under H<sub>0</sub>. IB scope: one-tailed only"]], "method": ["State H<sub>0</sub> and H<sub>1</sub> with the parameter (&mu;, p or m) and the tail.", "Choose the test: z (normal, &sigma; known), t (&sigma; unknown), binomial (proportion), Poisson (rate).", "Either compute the p-value and compare with &alpha;, or find the critical region and check the observed value.", "Type I: compute P(rejection region | H<sub>0</sub>). Type II: compute P(acceptance region | the given alternative value).", "Conclude in context."], "gdc": ["z-test: MENU 2, F3 TEST, F1 Z, F1 1-SAMPLE. Set the tail (&mu; < &mu;0, &ne;, >), &mu;0, &sigma;, x-bar, n.", "One-sample t-test: F3 TEST, F2 t, F1 1-SAMPLE. Data or Variable; set &mu;0 and the tail.", "Binomial tail: F5 DIST, F5 BINOMIAL, F2 Bcd. Poisson tail: F5 DIST, F6, F1 POISSON, F2 Pcd.", "Critical value for a mean: F5 DIST, F1 NORM, F3 InvN with &sigma;/&radic;n.", "Correlation test: F3 TEST, F2 t, F3 REG with the paired lists; read p."], "watch": ["Using the wrong tail (one-tailed H<sub>1</sub> with a two-tailed p-value).", "P(Type II) computed under H<sub>0</sub> instead of under the alternative value.", "For discrete tests, stating P(Type I) = 0.05 exactly; it is the actual tail probability of the chosen region.", "Rejection region stated as an open interval when the statistic is discrete (use X &le; 2, not X < 2)."]}};const QS=[{"id": "Q7-1", "skill": "T4.7-SL", "paper": "P1", "marks": 2, "diag": 1, "q": "A discrete random variable X has P(X = 1) = 0.1, P(X = 2) = 0.3, P(X = 3) = k, P(X = 4) = 0.2. Find k.", "ans": 0.4, "tol": 0.0005, "scheme": "0.1 + 0.3 + k + 0.2 = 1 (M1); k = 0.4 (A1)", "hint": "Probabilities sum to 1.", "wrong": "0.6", "why": "0.6 is the sum of the other three; k is what is left to reach 1.", "type": "auto", "unit": "", "accept": "", "gdc": "", "group": "", "stem": ""}, {"id": "Q7-2", "skill": "T4.7-SL", "paper": "P1", "marks": 2, "diag": 2, "q": "Using the distribution in the previous question (k = 0.4), find E(X).", "ans": 2.7, "tol": 0.005, "scheme": "E(X) = 1(0.1) + 2(0.3) + 3(0.4) + 4(0.2) (M1) = 2.7 (A1)", "hint": "Multiply each value by its probability and add.", "wrong": "2.5", "why": "2.5 is the midpoint of the values, not the mean weighted by probability.", "gdc": "Stats: List1 = 1,2,3,4; List2 = 0.1,0.3,0.4,0.2; 1VAR with Freq List2; read x-bar.", "type": "auto", "unit": "", "accept": "", "group": "", "stem": ""}, {"id": "Q7-3", "skill": "T4.7-SL", "paper": "P1", "marks": 4, "q": "P(X = x) = cx for x = 1, 2, 3, 4, 5. Find E(X). Give your answer to 3 s.f.", "ans": 3.6667, "tol": 0.004, "accept": "11/3", "scheme": "c(1 + 2 + 3 + 4 + 5) = 1 so c = 1/15 (M1 A1); E(X) = &Sigma; x<sup>2</sup>/15 = 55/15 (M1) = 11/3 = 3.67 (A1)", "hint": "Find c first from the total probability.", "wrong": "3", "why": "3 is the mean of 1 to 5 with equal probabilities; here larger values are more likely.", "type": "auto", "unit": "", "diag": 0, "gdc": "", "group": "", "stem": ""}, {"id": "Q7-4", "skill": "T4.7-SL", "paper": "P1", "marks": 3, "q": "A game costs $3 to play. With probability 0.2 the player wins $10; otherwise nothing. Find the expected gain per game, in dollars (negative for a loss).", "ans": -1, "tol": 0.005, "unit": "$", "scheme": "Gain: 7 with 0.2, minus 3 with 0.8 (M1); E(gain) = 7(0.2) + (minus 3)(0.8) (M1) = minus 1 (A1). Equivalent: E(winnings) minus 3 = 2 minus 3.", "hint": "Define X as gain = winnings minus stake.", "wrong": "2", "why": "2 is the expected winnings; the $3 stake has not been subtracted.", "type": "auto", "accept": "", "diag": 0, "gdc": "", "group": "", "stem": ""}, {"id": "Q7-5", "skill": "T4.7-SL", "paper": "P2", "marks": 4, "group": "G7", "stem": "A discrete random variable X takes the values 0, 1, 2, 3 with P(X = 0) = 0.2, P(X = 1) = a, P(X = 2) = b, P(X = 3) = 0.1. It is given that E(X) = 1.4.", "q": "(a) Find the value of b.", "ans": 0.4, "tol": 0.0005, "scheme": "a + b = 0.7 (A1); a + 2b + 0.3 = 1.4 (M1 A1); b = 0.4 (A1)", "hint": "Two equations: total probability and expected value.", "type": "auto", "unit": "", "accept": "", "diag": 0, "wrong": "", "why": "", "gdc": ""}, {"id": "Q7-6", "skill": "T4.7-SL", "paper": "P2", "marks": 3, "group": "G7", "q": "(b) [AHL 4.14 extension] Find Var(X).", "ans": 0.84, "tol": 0.005, "scheme": "E(X<sup>2</sup>) = 0 + 0.3 + 1.6 + 0.9 = 2.8 (M1 A1); Var(X) = 2.8 minus 1.4<sup>2</sup> = 0.84 (A1)", "hint": "Var(X) = E(X<sup>2</sup>) minus [E(X)]<sup>2</sup>.", "wrong": l": 0.0015, "scheme": "P(X &ge; 5) = 1 minus P(X &le; 4) (M1) = 0.276 (A1)", "hint": "Complement of at most 4.", "wrong": "0.493", "why": "0.493 is P(X &le; 3), the wrong cut-off and the wrong direction.", "gdc": "Bcd Lower 5, Upper 12, or 1 minus Bcd(0 to 4).", "type": "auto", "unit": "", "accept": "", "group": "", "stem": ""}, {"id": "Q8-3", "skill": "T4.8-SL", "paper": "P1", "marks": 3, "q": "X ~ B(12, 0.3). Find P(X &le; 3) and state Var(X). Enter P(X &le; 3).", "ans": 0.493, "tol": 0.0015, "scheme": "Bcd(0, 3, 12, 0.3) (M1) = 0.493 (A1); Var(X) = 12(0.3)(0.7) = 2.52 (A1)", "hint": "Cumulative from 0 to 3; variance np(1 minus p).", "type": "auto", "unit": "", "accept": "", "diag": 0, "wrong": "", "why": "", "gdc": "", "group": "", "stem": ""}, {"id": "Q8-4", "skill": "T4.8-SL", "paper": "P1", "marks": 4, "q": "Each item is defective with probability 0.1, independently. Find the smallest number of items n that must be inspected so that the probability of finding at least one defective item is at least 0.95.", "ans": 29, "tol": 0.4, "scheme": "1 minus 0.9<sup>n</sup> &ge; 0.95 (M1); 0.9<sup>n</sup> &le; 0.05 (A1); n &ge; log 0.05 / log 0.9 = 28.4 (M1); n = 29 (A1)", "hint": "At least one = 1 minus none.", "wrong": "28", "why": "n = 28.4 is the boundary; n must be an integer and at least this, so round up.", "type": "auto", "unit": "", "accept": "", "diag": 0, "gdc": "", "group": "", "stem": ""}, {"id": "Q8-5", "skill": "T4.8-SL", "paper": "P2", "marks": 2, "group": "G8", "stem": "A packet contains 20 seeds. Each seed germinates with probability 0.85, independently of the others. Let X be the number of seeds that germinate.", "q": "(a) State the distribution of X and find P(X = 17). Enter the probability.", "ans": 0.243, "tol": 0.0015, "scheme": "X ~ B(20, 0.85) (A1); P(X = 17) = 0.243 (A1)", "hint": "State the distribution for the first mark.", "type": "auto", "unit": "", "accept": "", "diag": 0, "wrong": "", "why": "", "gdc": ""}, {"id": "Q8-6", "skill": "T4.8-SL", "paper": "P2", "marks": 3, "group": "G8", "q": "(b) Find the probability that at least 18 seeds germinate.", "ans": 0.405, "tol": 0.0015, "scheme": "P(X &ge; 18) = 1 minus P(X &le; 17) (M1) = 0.405 (A2)", "wrong": "0.595", "why": "0.595 is P(X &le; 17); the complement was not taken.", "type": "auto", "unit": "", "accept": "", "diag": 0, "hint": "", "gdc": "", "stem": ""}, {"id": "Q8-7", "skill": "T4.8-SL", "paper": "P2", "marks": 2, "group": "G8", "q": "(c) Find the expected number of seeds that germinate.", "ans": 17, "tol": 0.005, "scheme": "E(X) = 20 &times; 0.85 (M1) = 17 (A1)", "type": "auto", "unit": "", "accept": "", "diag": 0, "hint": "", "wrong": "", "why": "", "gdc": "", "stem": ""}, {"id": "Q8-8", "skill": "T4.8-SL", "paper": "P2", "marks": 4, "group": "G8", "q": "(d) Given that at least 15 seeds germinate, find the probability that exactly 17 germinate.", "ans": 0.26, "tol": 0.0015, "scheme": "P(X = 17 | X &ge; 15) = P(X = 17) / P(X &ge; 15) (M1); P(X &ge; 15) = 0.933 (A1); 0.243 / 0.933 (M1) = 0.260 (A1)", "hint": "Conditional probability: the intersection is just X = 17.", "wrong": "0.243", "why": "The condition changes the denominator; divide by P(X &ge; 15).", "type": "auto", "unit": "", "accept": "", "diag": 0, "gdc": "", "stem": ""}, {"id": "Q8-9", "skill": "T4.8-SL", "paper": "P1", "marks": 3, "q": "X ~ B(15, 0.4). Find P(4 &le; X &le; 8).", "ans": 0.814, "tol": 0.0015, "scheme": "Bcd Lower 4, Upper 8 (M1 A1) = 0.814 (A1)", "gdc": "Bcd: Lower 4, Upper 8, Numtrial 15, p 0.4.", "wrong": "0.905", "why": "Lower entered as 3 includes P(X = 3); 4 &le; X means start at 4.", "type": "auto", "unit": "", "accept": "", "diag": 0, "hint": "", "group": "", "stem": ""}, {"id": "Q9-1", "skill": "T4.9-SL", "paper": "P1", "marks": 2, "diag": 1, "q": "X ~ N(50, 8<sup>2</sup>). Find P(X < 60).", "ans": 0.894, "tol": 0.0015, "scheme": "Ncd(minus 1E99, 60, 8, 50) (M1) = 0.894 (A1)", "gdc": "DIST, NORM, Ncd: Lower minus 1E99, Upper 60, sigma 8, mu 50.", "type": "auto", "unit": "", "accept": "", "hint": "", "wrong": "", "why": "", "group": "", "stem": ""}, {"id": "Q9-2", "skill": "T4.9-SL", "paper": "P1", "marks": 3, "diag": 2, "q": "X ~ N(50, 8<sup>2</sup>). Find k such that P(X > k) = 0.2.", "ans": 56.7, "tol": 0.06, "scheme": "Sketch with right tail 0.2 (M1); InvN Right, 0.2, 8, 50 (M1) = 56.7 (A1)", "wrong": "43.3", "why": "43.3 is the left-tail answer; P(X > k) = 0.2 puts k above the mean.", "gdc": "InvN: Tail Right, Area 0.2, sigma 8, mu 50.", "type": "auto", "unit": "", "accept": "", "hint": "", "group": "", "stem": ""}, {"id": "Q9-3", "skill": "T4.9-SL", "paper": "P1", "marks": 2, "q": "X ~ N(50, 8<sup>2</sup>). Find P(45 < X < 58).", "ans": 0.575, "tol": 0.0015, "scheme": "Ncd(45, 58, 8, 50) (M1) = 0.575 (A1)", "type": "auto", "unit": "", "accept": "", "diag": 0, "hint": "", "wrong": "", "why": "", "gdc": "", "group": "", "stem": ""}, {"id": "Q9-4", "skill": "T4.9-SL", "paper": "P1", "marks": 4, "q": "X ~ N(100, &sigma;<sup>2</sup>) and P(X < 110) = 0.9. Find &sigma;.", "ans": 7.8, "tol": 0.01, "scheme": "z = InvN(0.9) = 1.2816 (M1 A1); (110 minus 100)/&sigma; = 1.2816 (M1); &sigma; = 7.80 (A1)", "hint": "Standardise: z = (x minus mu)/sigma with z from N(0, 1).", "wrong": "7.69", "why": "Rounding z to 1.3 before dividing gives 7.69; keep z to 4 or more figures.", "gdc": "InvN Left, 0.9, sigma 1, mu 0 gives z.", "type": "auto", "unit": "", "accept": "", "diag": 0, "group": "", "stem": ""}, {"id": "Q9-5", "skill": "T4.9-SL", "paper": "P2", "marks": 2, "group": "G9", "stem": "The heights of adult men in a city are normally distributed with mean 170 cm and standard deviation 6 cm.", "q": "(a) Find the probability that a randomly chosen man is taller than 180 cm.", "ans": 0.0478, "tol": 0.0003, "scheme": "Ncd(180, 1E99, 6, 170) (M1) = 0.0478 (A1)", "type": "auto", "unit": "", "accept": "", "diag": 0, "hint": "", "wrong": "", "why": "", "gdc": ""}, {"id": "Q9-6", "skill": "T4.9-SL", "paper": "P2", "marks": 2, "group": "G9", "tol": 0.06, "scheme": "InvN Left 0.3, 15, 100 (M1 A1) = 92.1 (A1)", "type": "auto", "unit": "", "accept": "", "diag": 0, "hint": "", "wrong": "", "why": "", "gdc": "", "group": "", "stem": ""}, {"id": "Q11-1", "skill": "T4.11-SL", "paper": "P1", "marks": 3, "diag": 1, "q": "A fair-die claim is tested with 60 rolls. Observed frequencies for faces 1 to 6: 8, 12, 9, 11, 10, 10. Find the p-value of a chi-squared goodness of fit test at the 5% level (expected 10 each).", "ans": 0.963, "tol": 0.002, "scheme": "H<sub>0</sub>: die fair, H<sub>1</sub>: not fair; expected 10 each (A1); GOF, df = 5 (M1); p = 0.963 (A1)", "gdc": "TEST, CHI, GOF: List1 observed, List2 expected (10s), df 5.", "hint": "df = categories minus 1.", "type": "auto", "unit": "", "accept": "", "wrong": "", "why": "", "group": "", "stem": ""}, {"id": "Q11-2", "skill": "T4.11-SL", "paper": "P1", "marks": 2, "diag": 2, "type": "self", "q": "For the test in Q11-1, state the conclusion at the 5% level, in context.", "scheme": "p = 0.963 > 0.05 (R1); insufficient evidence to reject H<sub>0</sub>; the data are consistent with a fair die (A1). Do not write 'the die is fair'.", "tol": null, "unit": "", "accept": "", "hint": "", "wrong": "", "why": "", "gdc": "", "group": "", "stem": ""}, {"id": "Q11-3", "skill": "T4.11-SL", "paper": "P2", "marks": 2, "group": "G11", "stem": "A survey records preferred drink by age group. Observed counts:<br><table class='mini'><tr><th></th><th>Tea</th><th>Coffee</th><th>Juice</th></tr><tr><th>Under 30</th><td>30</td><td>20</td><td>10</td></tr><tr><th>30 and over</th><td>20</td><td>25</td><td>15</td></tr></table>A chi-squared test for independence is carried out at the 10% significance level.", "q": "(a) Write down the number of degrees of freedom.", "ans": 2, "tol": 0.1, "scheme": "(2 minus 1)(3 minus 1) = 2 (A1)", "type": "auto", "unit": "", "accept": "", "diag": 0, "hint": "", "wrong": "", "why": "", "gdc": ""}, {"id": "Q11-4", "skill": "T4.11-SL", "paper": "P2", "marks": 2, "group": "G11", "q": "(b) Find the expected frequency for Under 30 and Coffee.", "ans": 22.5, "tol": 0.05, "scheme": "60 &times; 45 / 120 (M1) = 22.5 (A1)", "hint": "Row total times column total over grand total.", "type": "auto", "unit": "", "accept": "", "diag": 0, "wrong": "", "why": "", "gdc": "", "stem": ""}, {"id": "Q11-5", "skill": "T4.11-SL", "paper": "P2", "marks": 3, "group": "G11", "q": "(c) Find the p-value.", "ans": 0.169, "tol": 0.0015, "scheme": "2WAY with observed matrix (M1); &chi;<sup>2</sup> = 3.56 (A1); p = 0.169 (A1)", "gdc": "TEST, CHI, 2WAY: Mat A 2x3 observed; read p and Mat B expected.", "type": "auto", "unit": "", "accept": "", "diag": 0, "hint": "", "wrong": "", "why": "", "stem": ""}, {"id": "Q11-6", "skill": "T4.11-SL", "paper": "P2", "marks": 3, "group": "G11", "type": "self", "q": "(d) State the hypotheses and the conclusion in context.", "scheme": "H<sub>0</sub>: preferred drink is independent of age group; H<sub>1</sub>: not independent (A1); p = 0.169 > 0.10 (R1); insufficient evidence to reject H<sub>0</sub>; no evidence of an association between drink and age (A1).", "tol": null, "unit": "", "accept": "", "diag": 0, "hint": "", "wrong": "", "why": "", "gdc": "", "stem": ""}, {"id": "Q11-7", "skill": "T4.11-SL", "paper": "P2", "marks": 4, "q": "Method A scores: 23, 27, 25, 30, 26, 28, 24, 29. Method B scores: 21, 25, 22, 26, 23, 24, 20, 27. Test at the 5% level whether the mean scores differ (two-sample t-test, pooled, two-tailed). Find the p-value.", "ans": 0.0281, "tol": 0.0005, "scheme": "H<sub>0</sub>: &mu;<sub>A</sub> = &mu;<sub>B</sub>, H<sub>1</sub>: &mu;<sub>A</sub> &ne; &mu;<sub>B</sub> (A1); 2-SAMPLE t, pooled, &ne; (M1); p = 0.0281 (A1); p < 0.05, reject H<sub>0</sub>: the means differ (R1)", "gdc": "TEST, t, 2-SAMPLE: List1, List2, Pooled On, tail not equal.", "wrong": "0.014", "why": "0.014 is the one-tailed p-value; 'differ' is two-tailed.", "type": "auto", "unit": "", "accept": "", "diag": 0, "hint": "", "group": "", "stem": ""}, {"id": "Q11-8", "skill": "T4.18-AHL", "paper": "P1", "marks": 4, "q": "Bottles are meant to contain 10 ml. A sample gives 9.8, 10.4, 10.1, 9.6, 10.5, 10.2, 9.9, 10.3. Test at the 5% level whether the mean differs from 10 (one-sample t-test). Find the p-value.", "ans": 0.394, "tol": 0.002, "scheme": "H<sub>0</sub>: &mu; = 10, H<sub>1</sub>: &mu; &ne; 10 (A1); t = 0.907 (A1); p = 0.394 (A1); p > 0.05, do not reject H<sub>0</sub> (R1)", "gdc": "TEST, t, 1-SAMPLE, Data, mu0 = 10, tail not equal.", "type": "auto", "unit": "", "accept": "", "diag": 0, "hint": "", "wrong": "", "why": "", "group": "", "stem": ""}, {"id": "Q17-1", "skill": "T4.17-AHL", "paper": "P1", "marks": 2, "diag": 1, "q": "X ~ Po(3.2). Find P(X = 2).", "ans": 0.209, "tol": 0.0015, "scheme": "Ppd(2, 3.2) (M1) = 0.209 (A1)", "gdc": "DIST, F6, POISSON, Ppd: x 2, mu 3.2.", "type": "auto", "unit": "", "accept": "", "hint": "", "wrong": "", "why": "", "group": "", "stem": ""}, {"id": "Q17-2", "skill": "T4.17-AHL", "paper": "P1", "marks": 3, "diag": 2, "q": "Calls arrive at a rate of 4 per hour. Find the probability of exactly 5 calls in 90 minutes.", "ans": 0.161, "tol": 0.0015, "scheme": "Mean for 90 min = 6 (A1); X ~ Po(6), Ppd(5, 6) (M1) = 0.161 (A1)", "hint": "Scale the mean to 90 minutes first.", "wrong": "0.156", "why": "0.156 uses Po(4); the mean must be rescaled to 1.5 hours.", "type": "auto", "unit": "", "accept": "", "gdc": "", "group": "", "stem": ""}, {"id": "Q17-3", "skill": "T4.17-AHL", "paper": "P1", "marks": 2, "q": "X ~ Po(3.2). Find P(X &ge; 3).", "ans": 0.62, "tol": 0.0015, "scheme": "1 minus P(X &le; 2) (M1) = 0.620 (A1)", "wrong": "0.219", "why": "0.219 is 1 minus P(X &le; 3); 'at least 3' removes only 0, 1, 2.", "type": "auto", "unit": "", "accept": "", "diag": 0, "hint": "", "gdc": "", "group": "", "stem": ""}, {"id": "Q17-4", "skill": "T4.17-AHL", "paper": "P1", "marks": 3, "q": "X ~ Po(2) and Y ~ Po(3) are independent. Find P(X + Y = 4).", "ans": 0.175, "tol": 0.0015, "scheme": "X + Y ~ Po(5) (M1 A1); Ppd(4, 5) = 0.175 (A1)", "hint": "Add the means, then compute.", "type": "auto", "unit": "", "accept": "", "diag": 0, "wrong": "", "why": "", "gdc": "", "group": "", "stem": ""}, {"id": "Q17-5", "skill": "T4.17-AHL", "paper": "P1", "marks": 4, "q": "X ~ Po(m) and P(X = 0) = 0.05. Find m to 3 s.f.", "ans": 3.0, "tol": 0.01, "scheme": "e<sup>minus m</sup> = 0.05 (M1 A1); m = minus ln 0.05 = ln 20 (M1) = 3.00 (A1)", "hint": "P(X = 0) = e to the power minus m.", "type": "auto", "unit": "", "accept": "", "diag": 0, "wrong": "", "why": "", "gdc": "", "group": "", "stem": ""}, {"id": "Q17-6", "skill": "T4.17-AHL", "paper": "P2", "marks": 2, "group": "G17", "stem": "A website receives, on average, 4.5 enquiries per day. The number of enquiries per day can be modelled by a Poisson distribution.", "q": "(a) Find the probability of at least 2 enquiries on a given day.", "ans": 0.939, "tol": 0.0015, "scheme": "1 minus P(X &le; 1) (M1) = 0.939 (A1)", "type": "auto", "unit": "", "accept": "", "diag": 0, "hint": "", "wrong": "", "why": "", "gdc": ""}, {"id": "Q17-7", "skill": "T4.17-AHL", "paper": "P2", "marks": 4, "group": "G17", "q": "(b) Given that there are at least 2 enquiries on a day, find the probability that there are exactly 3.", "ans": 0.18, "tol": 0.0015, "scheme": "P(X = 3)/P(X &ge; 2) (M1); 0.1687 / 0.9389 (A1 A1) = 0.180 (A1)", "type": "auto", "unit": "", "accept": "", "diag": 0, "hint": "", "wrong": "", "why": "", "gdc": "", "stem": ""}, {"id": "Q17-8", "skill": "T4.17-AHL", "paper": "P2", "marks": 3, "group": "G17", "q": "(c) Find the probability of exactly 30 enquiries in a 7-day week.", "ans": 0.0704, "tol": 0.0006, "scheme": "Mean 31.5 (A1); Ppd(30, 31.5) (M1) = 0.0704 (A1)", "type": "auto", "unit": "", "accept": "", "diag": 0, "hint": "", "wrong": "", "why": "", "gdc": "", "stem": ""}, {"id": "Q17-9", "skill": "T4.17-AHL", "paper": "P2", "marks": 3, "group": "G17", "type": "self", "q": "(d) State two conditions that must hold for the Poisson model to be appropriate here, and comment on whether one of them might fail.", "scheme": "Enquiries occur independently; at a constant average rate; singly (any two, A1 A1); e.g. the rate may vary by weekday or season, so the constant-rate condition may fail (R1).", "tol": null, "unit": "", "accept": "", "diag": 0, "hint": "", "wrong": "", "why": "", "gdc": "", "stem": ""}, {"id": "Q14-1", "skill": "T4.14-AHL", "paper": "P1", "marks": 2, "diag": 1, "q": "E(X) = 5 and Var(X) = 4. Find Var(3X minus 2).", "ans": 36, "tol": 0.05, "scheme": "Var(3X minus 2) = 9 Var(X) (M1) = 36 (A1)", "wrong": "12", "why": "12 is 3 &times; Var(X); the constant is squared. Minus 2 has no effect on variance.", "type": "auto", "unit": "", "accept": "", "hint": "", "gdc": "", "group": "", "stem": ""}, {"id": "Q14-2", "skill": "T4.14-AHL", "paper": "P1", "marks": 3, "diag": 2, "q": "X<sub>1</sub>, X<sub>2</sub>, X<sub>3</sub> are independent, each with mean 5 and variance 4. Find Var(X<sub>1</sub> + X<sub>2</sub> + X<sub>3</sub>).", "ans": 12, "tol": 0.05, "scheme": "Var = 4 + 4 + 4 (M1 A1) = 12 (A1)", "wrong": "36", "why": "36 is Var(3X), one value tripled. Three independent values add their variances.", "type": "auto", "unit": "", "accept": "", "hint": "", "gdc": "", "group": "", "stem": ""}, {"id": "Q14-3", "skill": "T4.14-AHL", "paper": "P1", "marks": 3, "q": "A sample of 5 values is 12, 15, 11, 18, 14. Find the unbiased estimate of the population variance.", "ans": 7.5, "tol": 0.01, "scheme": "x-bar = 14 (A1); s<sub>n minus 1</sub><sup>2</sup> = &Sigma;(x minus 14)<sup>2</sup>/4 = 30/4 (M1) = 7.5 (A1)", "gdc": "1VAR: sx = 2.739; square it. Or sigma x squared times 5/4.", "wrong": "6", "why": "6 is s<sub>n</sub><sup>2</sup> (divide by n). The unbiased estimate divides by n minus 1.", "type": "auto", "unit": "", "accept": "", "diag": 0, "hint": "", "group": "", "stem": ""}, {"id": "Q14-4", "skill": "T4.14-AHL", "paper": "P1", "marks": 3, "q": "X ~ N(10, 2<sup>2</sup>) and Y ~ N(8, 1.5<sup>2</sup>) are independent. Find P(X + Y > 20).", "ans": 0.212, "tol": 0.0015, "scheme": "X + Y ~ N(18, 6.25) (M1 A1); P(X + Y > 20) = 0.212 (A1)", "hint": "Variances add: 4 + 2.25.", "gdc": "Ncd(20, 1E99, 2.5, 18).", "type": "auto", "unit": "", "accept": "", "diag": 0, "wrong": "", "why": "", "group": "", "stem": ""}, {"id": "Q14-5", "skill": "T4.14-AHL", "paper": "P1", "marks": 4, "q": "With X and Y as in Q14-4, find P(X > Y).", "ans": 0.788, "tol": 0.0015, "scheme": "X minus Y ~ N(2, 6.25) (M1 A1); P(X minus Y > 0) (M1) = 0.788 (A1)", "wrong": "0.212", "why": "Wrong direction, or Var(X minus Y) computed as 4 minus 2.25 = 1.75. Variances add.", "type": "auto", "unit": "", "accept": "", "diag": 0, "hint": "", "gdc": "", "group": "", "stem": ""}, {"id": "Q14-6", "skill": "T4.14-AHL", "paper": "P2", "marks": 3, "group": "G14", "stem": "Bags of rice have masses, in kg, that are N(1.02, 0.03<sup>2</sup>). Six bags are chosen at random and placed in a box.", "q": "(a) Find the standard deviation of the total mass of the six bags, in kg, to 4 s.f.", "ans": 0.07348, "tol": 0.0002, "unit": "kg", "scheme": "Var(S) = 6 &times; 0.0009 = 0.0054 (M1 A1); SD = 0.0735 (A1)", "wrong": "0.18", "why": "0.18 = 6 &times; 0.03 is the SD of 6X, not of a sum of six independent bags.", "type": "auto", "accept": "", "diag": 0, "hint": "", "gdc": ""}, {"id": "Q14-7", "skill": "T4.14-AHL", "paper": "P2", "marks": 3, "group": "G14", "q": "(b) Find the probability that the total mass of the six bags is less than 6 kg.", "ans": 0.0512, "tol": 0.0005, "scheme": "S ~ N(6.12, 0.0054) (A1); Ncd(minus 1E99, 6, 0.07348, 6.12) (M1) = 0.0512 (A1)", "type": "auto", "unit": "", "accept": "", "diag": 0, "hint": "", "wrong": "", "why": "", "gdc": "", "stem": ""}, {"id": "Q14-8", "skill": "T4.14-AHL", "paper": "P2", "marks": 4, "group": "G14", "q": "(c) A single bag is weighed with a scale that reads 4 times the true mass. Find the variance of the reading. Enter the variance in kg<sup>2</sup>.", "ans": 0.0144, "tol": 0.0001, "scheme": "Reading = 4X (M1); Var = 16 &times; 0.0009 (M1 A1) = 0.0144 (A1)", "type": "auto", "unit": "", "accept": "", "diag": 0, "hint": "", "wrong": "", "why": "", "gdc": "", "stem": ""}, {"id": "Q14-9", "skill": "T4.14-AHL", "paper": "P1", "marks": 3, "type": "self", "q": "A sample of 40 values has mean 71 and s<sub>n</sub> = 5.2. Explain how to obtain unbiased estimates of the population mean and variance, and give both.", "scheme": "Unbiased estimate of &mu; is x-bar = 71 (A1); s<sub>n minus 1</sub><sup>2</sup> = (40/39) &times; 5.2<sup>2</sup> (M1) = 27.7 (A1).", "tol": null, "unit": "", "accept": "", "diag": 0, "hint": "", "wrong": "", "why": "", "gdc": "", "group": "", "stem": ""}, {"id": "Q15-1", "skill": "T4.15-AHL", "paper": "P1", "marks": 3, "diag": 1, "q": "Scores are N(70, 12<sup>2</sup>). A random sample of 36 is taken. Find P(sample mean > 73).", "ans": 0.0668, "tol": 0.0005, "scheme": "X-bar ~ N(70, 12<sup>2</sup>/36) = N(70, 4) (M1 A1); P(X-bar > 73) = 0.0668 (A1)", "hint": "SD of the mean is sigma over root n = 2.", "wrong": "0.401", "why": "0.401 uses sigma = 12; the mean of 36 values has SD 2.", "type": "auto", "unit": "", "accept": "", "gdc": "", "group": "", "stem": ""}, {"id": "Q15-2", "skill": "T4.15-AHL", "paper": "P1", "marks": 4, "diag": 2, "q": "A population has mean 20 and standard deviation 5 (not normal). A random sample of 50 is taken. Find P(sample mean < 19).", "ans": 0.0786, "tol": 0.0005, "scheme": "By the CLT, since n = 50 is large, X-bar is approx N(20, 25/50) (R1 A1); SD = 0.7071 (A1); P = 0.0786 (A1)", "hint": "State the CLT: the population is not normal.", "type": "auto", "unit": "", "accept": "", "wrong": "", "why": "", "gdc": "", "group": "", "stem": ""}, {"id": "Q15-3", "skill": "T4.15-AHL", "paper": "P1", "marks": 3, "q": "A population has standard deviation 8. Find the smallest sample size n for which the standard deviation of the sample mean is at most 1.", "ans": 64, "tol": 0.4, "scheme": "8/&radic;n &le; 1 (M1); &radic;n &ge; 8 (A1); n = 64 (A1)", "type": "auto", "unit": "", "accept": "", "diag": 0, "hint": "", "wrong": "", "why": "", "gdc": "", "group": "", "stem": ""}, {"id": "Q15-4", "skill": "T4.15-AHL", "paper": "P1", "marks": 3, "q": "X<sub>1</sub> to X<sub>4</sub> are independent N(5, 1). Find P(X<sub>1</sub> + X<sub>2</sub> + X<sub>3</sub> + X<sub>4</sub> > 22).", "ans": 0.159, "tol": 0.0015, "scheme": "S ~ N(20, 4) (M1 A1); P(S > 22) = 0.159 (A1)", "type": "auto", "unit": "", "accept": "", "diag": 0, "hint": "", "wrong": "", "why": "", "gdc": "", "group": "", "stem": ""}, {"id": "Q15-5", "skill": "T4.15-AHL", "paper": "P2", "marks": 2, "group": "G15", "stem": "The time a customer spends in a shop has mean 14.0 minutes and standard deviation 6.0 minutes. The distribution is skewed, not normal. A random sample of 40 customers is observed.", "q": "(a) Write down the standard deviation of the sample mean, in minutes, to 3 s.f.", "ans": 0.949, "tol": 0.002, "scheme": "6/&radic;40 (M1) = 0.949 (A1)", "type": "auto", "unit": "", "accept": "", "diag": 0, "hint": "", "wrong": "", "why": "", "gdc": ""}, {"id": "Q15-6", "skill": "T4.15-AHL", "paper": "P2", "marks": 3, "group": "G15", "type": "self", "q": "(b) Explain why the sample mean can be modelled by a normal distribution even though the population is skewed, and state the distribution.", "scheme": "Central limit theorem (R1): n = 40 is large, so X-bar is approximately normal (R1); X-bar ~ N(14, 0.9) (A1).", "tol": null, "unit": "", "accept": "", "diag": 0, "hint": "", "wrong": "", "why": "", "gdc": "", "stem": ""}, {"id": "Q15-7", "skill": "T4.15-AHL", "paper": "P2", "marks": 3, "group": "G15", "q": "(c) Find the probability that the sample mean exceeds 16 minutes.", "ans": 0.0175, "tol": 0.0003, "scheme": "Ncd(16, 1E99, 0.9487, 14) (M1 A1) = 0.0175 (A1)", "type": "auto", "unit": "", "accept": "", "diag": 0, "hint": "", "wrong": "", "why": "", "gdc": "", "stem": ""}, {"id": "Q15-8", "skill": "T4.15-AHL", "paper": "P2", "marks": 4, "group": "G15", "q": "(d) Find the value m such that P(sample mean < m) = 0.99, in minutes.", "ans": 16.2, "tol": 0.05, "scheme": "InvN Left 0.99, 0.9487, 14 (M1 A1) = 16.2 (A2)", "type": "auto", "unit": "", "accept": "", "diag": 0, "hint": "", "wrong": "", "why": "", "gdc": "", "stem": ""}, {"id": "Q16-1", "skill": "T4.16-AHL", "paper": "P1", "marks": 3, "diag": 1, "q": "A population has &sigma; = 4. A sample of 25 has mean 52. Find the upper limit of a 95% confidence interval for &mu;.", "ans": 53.568, "tol": 0.02, "scheme": "z = 1.960 (A1); 52 + 1.960 &times; 4/5 (M1); [50.4, 53.6] (A1)", "gdc": "INTR, Z, 1-SAMPLE: C-Level 0.95, sigma 4, x-bar 52, n 25.", "type": "auto", "unit": "", "accept": "", "hint": "", "wrong": "", "why": "", "group": "", "stem": ""}, {"id": "Q16-2", "skill": "T4.16-AHL", "paper": "P1", "marks": 4, "diag": 2, "q": "A sample of 10 has mean 18.2 and unbiased standard deviation s<sub>n minus 1</sub> = 2.1; &sigma; is unknown and the population is normal. Find the lower limit of a 90% confidence interval for &mu;.", "ans": 16.98, "tol": 0.02, "scheme": "t-interval, df = 9 (M1); t = 1.833 (A1); 18.2 minus 1.833 &times; 2.1/&radic;10 (M1); [17.0, 19.4] (A1)", "wrong": "17.1", "why": "17.1 uses z = 1.645. With sigma unknown and n = 10, use t with 9 df.", "gdc": "INTR, t, 1-SAMPLE: C-Level 0.9, x-bar 18.2, sx 2.1, n 10.", "type": "auto", "unit": "", "accept": "", "hint": "", "group": "", "stem": ""}, {"id": "Q16-3", "skill": "T4.16-AHL", "paper": "P1", "marks": 4, "q": "A population has &sigma; = 6. Find the smallest sample size n for which a 95% confidence interval for &mu; has width at most 2.", "ans": 139, "tol": 0.4, "scheme": "2 &times; 1.960 &times; 6/&radic;n &le; 2 (M1 A1); &radic;n &ge; 11.76, n &ge; 138.3 (A1); n = 139 (A1)", "wrong": "138", "why": "138.3 rounds up to 139; n = 138 gives a width slightly over 2.", "type": "auto", "unit": "", "accept": "", "diag": 0, "hint": "", "gdc": "", "group": "", "stem": ""}, {"id": "Q16-4", "skill": "T4.16-AHL", "paper": "P1", "marks": 2, "type": "self", "q": "A 95% confidence interval for the mean mass of a product is [498, 502] grams. A student writes: 'There is a 95% probability that the population mean is between 498 g and 502 g.' Explain what is wrong and give a correct interpretation.", "scheme": "&mu; is fixed; the interval is random, so probability statements are about the method not &mu; (R1); correct: if many samples were taken, about 95% of the intervals so constructed would contain &mu; (A1).", "tol": null, "unit": "", "accept": "", "diag": 0, "hint": "", "wrong": "", "why": "", "gdc": "", "group": "", "stem": ""}, {"id": "Q16-5", "skill": "T4.16-AHL", "paper": "P2", "marks": 3, "group": "G16", "stem": "A sample of 40 batteries has mean life 71.0 hours and the unbiased estimate of the population standard deviation is 5.2 hours. Battery life is normally distributed.", "q": "(a) Find the lower limit of a 99% confidence interval for the mean battery life, using a z-interval with &sigma; taken as 5.2.", "ans": 68.882, "tol": 0.02, "unit": "h", "scheme": "z = 2.576 (A1); 71 minus 2.576 &times; 5.2/&radic;40 (M1); [68.9, 73.1] (A1)", "type": "auto", "accept": "", "diag": 0, "hint": "", "wrong": "", "why": "", "gdc": ""}, {"id": "Q16-6", "skill": "T4.16-AHL", "paper": "P2", "marks": 2, "group": "G16", "type": "self", "q": "(b) The manufacturer claims the mean life is 74 hours. Comment, using the interval.", "scheme": "74 is outside the 99% interval (R1); the sample gives evidence against the claim at the 1% level (A1).", "tol": null, "unit": "", "accept": "", "diag": 0, "hint": "", "wrong": "", "why": "", "gdc": "", "stem": ""}, {"id": "Q16-7", "skill": "T4.16-AHL", "paper": "P2", "marks": 3, "group": "G16", "type": "self", "q": "(c) Explain the effect on the interval of (i) increasing the sample size, (ii) using a 95% level instead of 99%.", "scheme": "(i) narrower, since the margin z&sigma;/&radic;n decreases (A1 R const KEY='aihl_t4_prep_v1';
let S=load();function load(){try{return Object.assign({log:[],wrong:{},diag:{},p3:{},selfm:{}},JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){return{log:[],wrong:{},diag:{},p3:{},selfm:{}}}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const today=()=>new Date().toISOString().slice(0,10);
const byId=id=>QS.find(q=>q.id===id);const sk=id=>SKILLS.find(s=>s.id===id);
function record(q,correct,marks){S.log.push({id:q.id,skill:q.skill,ok:correct,d:today(),m:marks});if(!correct)S.wrong[q.id]=(S.wrong[q.id]||0)+1;else delete S.wrong[q.id];save()}
function mastery(sid){const ok=S.log.filter(l=>l.skill===sid&&l.ok);const days=new Set(ok.map(l=>l.d));const n=ok.length;if(n>=3&&days.size>=2)return['Mastered','m'];if(n>=1)return['In progress','d'];return['Not started','n']}
function parseAns(s){s=s.trim().replace(/[$%,]/g,'');if(/^-?\d+(\.\d+)?\/\d+(\.\d+)?$/.test(s)){const[a,b]=s.split('/');return parseFloat(a)/parseFloat(b)}const v=parseFloat(s);return isNaN(v)?null:v}
function check(q,s){const v=parseAns(s);if(v===null)return false;if(Math.abs(v-q.ans)<=q.tol)return true;if(q.accept&&s.trim()===q.accept)return true;const r3=Number(q.ans.toPrecision(3));if(Math.abs(v-r3)<=Math.abs(r3)*0.0006+1e-9)return true;return false}
let view='home';const VIEWS=[['home','Where am I?'],['learn','Learn'],['practise','Practise'],['assess','Assess'],['progress','Progress'],['review','Review']];
function nav(){document.getElementById('nav').innerHTML=VIEWS.map(v=>`<button class="${view===v[0]?'on':''}" onclick="go('${v[0]}')">${v[1]}</button>`).join('')}
function go(v){view=v;render()}
function render(){nav();const m=document.getElementById('main');({home,learn,practise,assess,progress,review})[view](m);window.scrollTo(0,0)}
function tagLevel(sid){const s=sk(sid);return `<span class="tag ${s.level==='AHL'?'ahl':'sl'}">${s.level}</span><span class="tag">${sid}</span>`}
// ---------- question widget
function qhtml(q,ctx){const wrong=S.wrong[q.id];let h=`<div class="card" id="c_${ctx}_${q.id}">`;
 if(q.stem&&ctx!=='group')h+=`<div class="stem">${q.stem}</div>`;
 h+=`<div class="row">${tagLevel(q.skill)}<span class="tag">${q.paper}</span><span class="tag">${q.marks} marks</span><span class="tag">${q.type==='auto'?'auto-marked':'self-marked'}</span>${wrong?'<span class="tag" style="color:var(--red)">missed before</span>':''}</div>`;
 h+=`<div class="q">${q.q}</div>`;
 if(q.type==='auto'){h+=`<div class="row"><input type="text" id="in_${ctx}_${q.id}" placeholder="answer (3 s.f.)" onkeydown="if(event.key==='Enter')sub('${q.id}','${ctx}')"> <span class="muted">${q.unit}</span><button class="btn" onclick="sub('${q.id}','${ctx}')">Check</button>${q.hint?`<button class="btn ghost2" onclick="hint('${q.id}','${ctx}')">Hint</button>`:''}</div><div id="fb_${ctx}_${q.id}"></div>`}
 else{h+=`<textarea id="ta_${ctx}_${q.id}" placeholder="Write your answer here, then reveal the mark scheme and award yourself marks."></textarea><div class="row"><button class="btn" onclick="revealSelf('${q.id}','${ctx}')">Reveal mark scheme</button></div><div id="fb_${ctx}_${q.id}"></div>`}
 return h+'</div>'}
function hint(id,ctx){const q=byId(id);document.getElementById(`fb_${ctx}_${id}`).innerHTML=`<div class="fb info">Hint: ${q.hint}</div>`}
function sub(id,ctx){const q=byId(id);const s=document.getElementById(`in_${ctx}_${id}`).value;const ok=check(q,s);record(q,ok,ok?q.marks:0);
 let h=ok?`<div class="fb ok">Correct. ${q.marks}/${q.marks}.<div class="scheme">${q.scheme}</div>${q.gdc?`<div class="muted" style="margin-top:6px">fx-CG50: ${q.gdc}</div>`:''}</div>`:`<div class="fb bad">Not correct. Expected ${fmt(q)}${q.unit?' '+q.unit:''}.<div class="scheme">${q.scheme}</div>${q.wrong?`<div class="muted" style="margin-top:6px">Common wrong answer ${q.wrong}: ${q.why}</div>`:''}${q.gdc?`<div class="muted" style="margin-top:6px">fx-CG50: ${q.gdc}</div>`:''}<button class="btn ghost" onclick="retry('${id}','${ctx}')">Retry</button></div>`;
 document.getElementById(`fb_${ctx}_${id}`).innerHTML=h;if(ctx.startsWith('diag'))diagNext(q,ok);if(ctx==='ap1')ap1tally()}
function fmt(q){const a=q.ans;if(Number.isInteger(a))return a;return Number(a.toPrecision(3))}
function retry(id,ctx){document.getElementById(`in_${ctx}_${id}`).value='';document.getElementById(`fb_${ctx}_${id}`).innerHTML=''}
function revealSelf(id,ctx){const q=byId(id);let b='';for(let i=0;i<=q.marks;i++)b+=`<button class="btn ghost" onclick="awardSelf('${id}','${ctx}',${i})">${i}</button>`;
 document.getElementById(`fb_${ctx}_${id}`).innerHTML=`<div class="fb info"><div class="scheme">${q.scheme}</div><div style="margin-top:8px">Award yourself marks out of ${q.marks}: ${b}</div></div>`}
function awardSelf(id,ctx,m){const q=byId(id);const ok=m>=Math.ceil(q.marks*0.7);record(q,ok,m);S.selfm[id]=m;save();document.getElementById(`fb_${ctx}_${id}`).innerHTML+=`<div class="fb ${ok?'ok':'bad'}">Recorded ${m}/${q.marks}${ok?' (counts towards mastery)':' (below 70%, does not count; see Review)'}</div>`;if(ctx.startsWith('diag'))diagNext(q,ok)}

let diagState=null;
function home(m){let h=`<div class="card"><h2>Where am I?</h2><p class="muted">Two questions per skill, nine skills. The second question is only asked if you get the first right. The result places each skill at Secure, Developing or Start here and sets your Practise order. Takes about 25 minutes at exam pace.</p>`;
 const done=Object.keys(S.diag).length;
 if(done){h+=`<h3>Last diagnostic</h3><div class="grid">`+SKILLS.map(s=>{const d=S.diag[s.id];const lvl=!d?['not done','n']:d===2?['Secure','m']:d===1?['Developing','d']:['Start here','s'];return `<div class="box"><div class="row">${tagLevel(s.id)}</div><div style="margin:4px 0">${s.name}</div><span class="pill ${lvl[1]}">${lvl[0]}</span></div>`}).join('')+`</div>`;
   const order=SKILLS.slice().sort((a,b)=>(S.diag[a.id]??-1)-(S.diag[b.id]??-1));h+=`<h3>Suggested starting point</h3><p>Work Practise in this order: ${order.map(s=>s.short).join(' &rarr; ')}.</p>`}

function startDiag(){diagState={i:0,level:1,res:{}};S.diag={};save();diagStep()}
function diagStep(){const area=document.getElementById('diagArea');if(!area)return;if(diagState.i>=SKILLS.length){S.diag=diagState.res;save();diagState=null;render();return}
 const s=SKILLS[diagState.i];const q=QS.find(x=>x.skill===s.id&&x.diag===diagState.level);
 area.innerHTML=`<div class="card"><div class="muted">Skill ${diagState.i+1} of ${SKILLS.length}: ${s.name} (question ${diagState.level} of 2)</div></div>`+qhtml(q,'diag'+diagState.i+'_'+diagState.level)+`<div class="card"><button class="btn ghost2" onclick="diagSkip()">Skip this skill (counts as Start here)</button></div>`}
function diagSkip(){diagState.res[SKILLS[diagState.i].id]=0;diagState.i++;diagState.level=1;diagStep()}
function diagNext(q,ok){const s=SKILLS[diagState.i];if(diagState.level===1){if(ok){diagState.level=2}else{diagState.res[s.id]=0;diagState.i++;diagState.level=1}}else{diagState.res[s.id]=ok?2:1;diagState.i++;diagState.level=1}
 setTimeout(diagStep,1400)}

function tick(){const el=document.getElementById('timer');if(!el){clearInterval(timer);return}const mm=Math.floor(tLeft/60),ss=tLeft%60;el.textContent=`${mm}:${ss<10?'0':''}${ss}`;el.className='timer'+(tLeft<120?' low':'');if(tLeft<=0){clearInterval(timer);el.textContent='Time';}else tLeft--}
let assessMode='';
function assess(m){let h=`<div class="card"><h2>Assess</h2><p class="muted">Timed at 2.5 minutes per mark. Write full working on paper as you would in the exam; the app only checks final answers.</p><div class="row"><button class="btn" onclick="assessMode='p1';render();startTimer(${ASSESS_P1.reduce((a,id)=>a+byId(id).marks,0)*150})">Paper 1 drill (9 questions)</button><button class="btn" onclick="assessMode='p2';render();startTimer(${ASSESS_P2.reduce((a,g)=>a+QS.filter(q=>q.group===g).reduce((b,q)=>b+q.marks,0),0)*150})">Paper 2 drill (2 questions)</button><button class="btn" onclick="assessMode='p3';render();startTimer(${P3.time*60})">Paper 3 task (self-marked)</button></div>${assessMode?`<div style="margin-top:10px">Time left: <span class="timer" id="timer"></span></div>`:''}</div>`;
 if(assessMode==='p1'){h+=`<div class="card"><h3>Paper 1 drill</h3><div id="ap1score" class="muted">0 marks so far</div></div>`+ASSESS_P1.map(id=>qhtml(byId(id),'ap1')).join('')}
 if(assessMode==='p2'){ASSESS_P2.forEach(g=>{const qs=QS.filter(q=>q.group===g);h+=`<div class="card"><h3>Paper 2 style</h3><div class="stem">${qs[0].stem}</div></div>`+qs.map(q=>qhtml(q,'ap2')).join('')})}
 if(assessMode==='p3'){h+=`<div class="card"><h3>${P3.title}</h3><div class="stem">${P3.intro}</div><p class="muted">Answer every part on paper first. Then reveal each mark scheme and award marks. Total ${P3.parts.reduce((a,p)=>a+p[1],0)} marks, ${P3.time} minutes.</p></div>`;
  P3.parts.forEach((p,i)=>{h+=`<div class="card"><div class="q">${p[0]} <span class="tag">${p[1]} marks</span></div><button class="btn" onclick="p3reveal(${i})">Reveal mark scheme</button><div id="p3fb_${i}">${S.p3[i]!==undefined?`<div class="fb info">Awarded ${S.p3[i]}/${p[1]} last time</div>`:''}</div></div>`});
  h+=`<div class="card" id="p3total">${p3total()}</div>`}
 m.innerHTML=h}
function ap1tally(){const el=document.getElementById('ap1score');if(!el)return;const got=ASSESS_P1.reduce((a,id)=>{const inp=document.getElementById('in_ap1_'+id);const q=byId(id);return a+(inp&&check(q,inp.value)?q.marks:0)},0);const tot=ASSESS_P1.reduce((a,id)=>a+byId(id).marks,0);el.textContent=`${got}/${tot} marks (${Math.round(100*got/tot)}%)`}
function p3reveal(i){const p=P3.parts[i];let b='';for(let k=0;k<=p[1];k++)b+=`<button class="btn ghost" onclick="p3award(${i},${k})">${k}</button>`;document.getElementById('p3fb_'+i).innerHTML=`<div class="fb info"><div class="scheme">${p[2]}</div><div style="margin-top:8px">Marks: ${b}</div></div>`}
function p3award(i,k){S.p3[i]=k;save();document.getElementById('p3fb_'+i).innerHTML+=`<div class="fb ok">Recorded ${k}/${P3.parts[i][1]}</div>`;const t=document.getElementById('p3total');if(t)t.innerHTML=p3total()}
function p3total(){const got=Object.values(S.p3).reduce((a,b)=>a+b,0);const tot=P3.parts.reduce((a,p)=>a+p[1],0);return `<b>Paper 3 total: ${got}/${tot}</b> <span class="muted">(${Math.round(100*got/tot)}%). Grade 7 territory on a Paper 3 is usually around 70% and above; treat anything under 55% as a signal to revisit Learn for the skills in the parts you lost.</span>`}
// ---------- Progress
function progress(m){let h=`<div class="card"><h2>Progress</h2><p class="muted">Mastery = three correct answers on two different days. Stored only in this browser. Use the export code to move it to another device.</p><div class="grid">`;
 SKILLS.forEach(s=>{const [lab,cls]=mastery(s.id);const ok=S.log.filter(l=>l.skill===s.id&&l.ok).length;const tot=S.log.filter(l=>l.skill===s.id).length;const pct=tot?Math.round(100*ok/tot):0;
  h+=`<div class="box"><div class="row">${tagLevel(s.id)}</div><div style="margin:4px 0">${s.name}</div><span class="pill ${cls}">${lab}</span><div class="muted" style="margin:6px 0 4px">${ok} correct of ${tot} attempts (${pct}%)</div><div class="bar"><i style="width:${Math.min(100,ok*33)}%"></i></div></div>`});
 h+=`</div><h3>Export / import</h3><div class="row"><button class="btn" onclick="exportCode()">Export code</button><button class="btn ghost" onclick="importCode()">Import code</button><button class="btn ghost2" onclick="if(confirm('Clear all progress in this browser?')){S={log:[],wrong:{},diag:{},p3:{},selfm:{}};save();render()}">Reset</button></div><textarea id="code" placeholder="Export code appears here; paste a code here before Import."></textarea></div>`;m.innerHTML=h}
function exportCode(){document.getElementById('code').value=btoa(unescape(encodeURIComponent(JSON.stringify(S))))}
function importCode(){try{const v=document.getElementById('code').value.trim();S=Object.assign({log:[],wrong:{},diag:{},p3:{},selfm:{}},JSON.parse(decodeURIComponent(escape(atob(v)))));save();render()}catch(e){alert('Code not recognised')}}
// ---------- Review
function review(m){const ids=Object.keys(S.wrong);let h=`<div class="card"><h2>Review</h2><p class="muted">Questions you got wrong and have not yet got right. Read the mark scheme, then retry. A correct retry removes it from this list.</p></div>`;
 if(!ids.length)h+=`<div class="card">Nothing to review. Go to Practise or Assess.</div>`;
 ids.forEach(id=>{const q=byId(id);h+=`<div class="card"><div class="row">${tagLevel(q.skill)}<span class="tag">${q.paper}</span><span class="tag">missed ${S.wrong[id]}x</span></div><div class="q">${q.stem?`<div class="stem">${q.stem}</div>`:''}${q.q}</div><details><summary>Mark scheme</summary><div class="scheme">${q.scheme}</div>${q.wrong?`<div class="muted" style="margin-top:6px">Common wrong answer ${q.wrong}: ${q.why}</div>`:''}</details></div>`+qhtml(q,'rv')});
 m.innerHTML=h}
render();
</script>
</body>
</html>
